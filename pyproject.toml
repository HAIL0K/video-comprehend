[project]
name = "video-comprehend"
version = "0.3.0"
description = "Video comprehension skill for Claude Code (YouTube, any yt-dlp source, local files)"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "numpy", "pillow"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
